# Parallel build jobs: keep 1 CPU in 6 free for the system, at least 1 (20 -> 17, 4 -> 3)
import os
config_opts['macros']['%_smp_build_ncpus'] = str(os.cpu_count() - max(1, os.cpu_count() // 6))

# Faster package downloads (default is 3)
config_opts['dnf_common_opts'] = ['--setopt=max_parallel_downloads=10']

# Shorter cache ages for rawhide (reduces stale environment issues)
config_opts['plugin_conf']['root_cache_opts']['max_age_days'] = 7
config_opts['plugin_conf']['yum_cache_opts']['max_metadata_age_days'] = 7

# Use overlayfs instead of root_cache (much faster, no tarball compression).
# base_dir must exist, owned root:mock, mode 2775.
config_opts['plugin_conf']['root_cache_enable'] = False
config_opts['plugin_conf']['overlayfs_enable'] = True
config_opts['plugin_conf']['overlayfs_opts']['base_dir'] = '/var/lib/mock/overlayfs'
